services:
  - type: web
    name: card-game-score
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data/rooms
    disk:
      name: card-game-score-data
      mountPath: /var/data
      sizeGB: 1

