<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Game Score Tracker</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color-scheme: light;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 820px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      margin-bottom: 16px;
    }

    h1, h2 {
      margin-top: 0;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="number"] {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
    }

    input[type="text"] {
      min-width: 220px;
      flex: 1;
    }

    input[type="number"] {
      width: 120px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-score {
      min-width: 40px;
      font-size: 16px;
      background: #111827;
      color: #fff;
    }

    .players {
      display: grid;
      gap: 10px;
    }

    .player-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 8px;
      align-items: center;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px;
    }

    .name {
      font-weight: 600;
    }

    .score {
      min-width: 44px;
      text-align: center;
      font-weight: 700;
    }

    .muted {
      color: #6b7280;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Card Game Score Tracker</h1>
    <p id="permissionBanner" class="muted" style="margin-top: -10px; margin-bottom: 16px;"></p>

    <section id="createSection" class="card">
      <h2>Create Players</h2>
      <div class="row">
        <input id="playerName" type="text" placeholder="Player name" />
        <input id="initialScore" type="number" value="2" />
        <button id="addPlayerBtn" class="btn-primary">Add Player</button>
      </div>
      <p class="muted">Add player names and set their initial score.</p>
    </section>

    <section class="card">
      <h2>Main Page Scores</h2>
      <div id="playersList" class="players"></div>
      <p id="emptyState" class="muted">No players yet. Create one above.</p>
      <div class="row" style="margin-top: 12px;">
        <button id="resetBtn" class="btn-secondary">Reset All Scores to 2</button>
      </div>
    </section>
  </main>

  <script>
    const DEFAULT_RESET_SCORE = 2;
    const STORAGE_KEY_PREFIX = "card-game-score.room.";

    function isMasterMode() {
      const params = new URLSearchParams(window.location.search);
      return params.get("master") === "true";
    }

    function getRoomId() {
      const params = new URLSearchParams(window.location.search);
      const raw = (params.get("roomId") || "default").trim();
      if (raw.length > 50) return "default";
      if (!/^[a-zA-Z0-9_-]+$/.test(raw)) return "default";
      return raw;
    }

    const canEdit = isMasterMode();
    const roomId = getRoomId();
    const players = [];
    let serverAvailable = true;

    const permissionBanner = document.getElementById("permissionBanner");
    const createSection = document.getElementById("createSection");
    const playerNameInput = document.getElementById("playerName");
    const initialScoreInput = document.getElementById("initialScore");
    const addPlayerBtn = document.getElementById("addPlayerBtn");
    const playersList = document.getElementById("playersList");
    const emptyState = document.getElementById("emptyState");
    const resetBtn = document.getElementById("resetBtn");

    function getStorageKey() {
      return `${STORAGE_KEY_PREFIX}${roomId}`;
    }

    function loadFromLocal() {
      try {
        const raw = localStorage.getItem(getStorageKey());
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed
          .filter((p) => p && typeof p.name === "string" && typeof p.score === "number")
          .map((p) => ({ name: p.name, score: p.score }));
      } catch {
        return [];
      }
    }

    function saveToLocal() {
      try {
        localStorage.setItem(getStorageKey(), JSON.stringify(players));
      } catch {
        // ignore local storage errors
      }
    }

    async function loadFromServer() {
      const response = await fetch(`/api/rooms/${encodeURIComponent(roomId)}`);
      if (!response.ok) throw new Error("Failed to load room");
      const data = await response.json();
      players.splice(0, players.length, ...(Array.isArray(data.players) ? data.players : []));
    }

    async function saveToServer() {
      if (!canEdit) return;
      const url = `/api/rooms/${encodeURIComponent(roomId)}?master=true`;
      const response = await fetch(url, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ players })
      });
      if (!response.ok) throw new Error("Failed to save room");
    }

    async function persistPlayers() {
      if (!canEdit) return;
      if (serverAvailable) {
        try {
          await saveToServer();
          return;
        } catch {
          serverAvailable = false;
        }
      }
      saveToLocal();
    }

    function applyPermissionsToUI() {
      if (canEdit) {
        permissionBanner.textContent = `Room: ${roomId} — Edit mode enabled (master=true).`;
        createSection.style.display = "";
        resetBtn.style.display = "";
      } else {
        permissionBanner.textContent = `Room: ${roomId} — View-only mode.`;
        createSection.style.display = "none";
        resetBtn.style.display = "none";
      }
    }

    function renderPlayers() {
      playersList.innerHTML = "";

      if (players.length === 0) {
        emptyState.style.display = "block";
        return;
      }

      emptyState.style.display = "none";

      players.forEach((player, index) => {
        const row = document.createElement("div");
        row.className = "player-row";
        row.style.gridTemplateColumns = canEdit ? "1fr auto auto auto" : "1fr auto";

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = player.name;

        const score = document.createElement("span");
        score.className = "score";
        score.textContent = player.score;

        row.append(name, score);

        if (canEdit) {
          const increaseBtn = document.createElement("button");
          increaseBtn.className = "btn-score";
          increaseBtn.textContent = "+";
          increaseBtn.addEventListener("click", () => {
            players[index].score += 1;
            persistPlayers();
            renderPlayers();
          });

          const decreaseBtn = document.createElement("button");
          decreaseBtn.className = "btn-score";
          decreaseBtn.textContent = "-";
          decreaseBtn.addEventListener("click", () => {
            players[index].score -= 1;
            persistPlayers();
            renderPlayers();
          });

          row.append(increaseBtn, decreaseBtn);
        }

        playersList.appendChild(row);
      });
    }

    function addPlayer() {
      if (!canEdit) return;
      const name = playerNameInput.value.trim();
      const initialScore = Number(initialScoreInput.value);

      if (!name) {
        alert("Please enter a player name.");
        return;
      }

      if (Number.isNaN(initialScore)) {
        alert("Please enter a valid initial score.");
        return;
      }

      players.push({ name, score: initialScore });
      persistPlayers();
      playerNameInput.value = "";
      playerNameInput.focus();
      renderPlayers();
    }

    if (canEdit) {
      addPlayerBtn.addEventListener("click", addPlayer);
      playerNameInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") addPlayer();
      });

      initialScoreInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") addPlayer();
      });

      resetBtn.addEventListener("click", () => {
        players.forEach((player) => {
          player.score = DEFAULT_RESET_SCORE;
        });
        persistPlayers();
        renderPlayers();
      });
    }

    applyPermissionsToUI();

    (async () => {
      try {
        await loadFromServer();
      } catch {
        serverAvailable = false;
        players.splice(0, players.length, ...loadFromLocal());
      } finally {
        renderPlayers();
        if (!serverAvailable) {
          permissionBanner.textContent += " Data is saved in this browser.";
        }
      }

      if (!canEdit && serverAvailable) {
        setInterval(async () => {
          try {
            await loadFromServer();
            renderPlayers();
          } catch {
            // ignore polling errors
          }
        }, 2000);
      }
    })();
  </script>
</body>
</html>
